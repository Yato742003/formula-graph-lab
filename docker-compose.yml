services:
  neo4j:
    image: neo4j:5.26-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://localhost:7474 >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  graph-api:
    build:
      context: ./services/graph-api
    restart: unless-stopped
    environment:
      APP_ENV: production
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      FGL_ENABLE_PROPOSALS: ${FGL_ENABLE_PROPOSALS:-false}
      FGL_ENABLE_PROPOSAL_GENERATION: ${FGL_ENABLE_PROPOSAL_GENERATION:-false}
      FGL_PROPOSAL_MODEL: ${FGL_PROPOSAL_MODEL:-}
      FGL_PROPOSAL_MAX_COST_USD: ${FGL_PROPOSAL_MAX_COST_USD:-}
      FGL_PROPOSAL_DAILY_MAX_COST_USD: ${FGL_PROPOSAL_DAILY_MAX_COST_USD:-}
      FGL_PROPOSAL_INPUT_USD_PER_MILLION: ${FGL_PROPOSAL_INPUT_USD_PER_MILLION:-}
      FGL_PROPOSAL_OUTPUT_USD_PER_MILLION: ${FGL_PROPOSAL_OUTPUT_USD_PER_MILLION:-}
      FGL_PROPOSAL_MAX_OUTPUT_TOKENS: ${FGL_PROPOSAL_MAX_OUTPUT_TOKENS:-2000}
      SERVICE_TOKEN: ${SERVICE_TOKEN:?set SERVICE_TOKEN}
      SEARCH_CURSOR_SECRET: ${SEARCH_CURSOR_SECRET:-}
    ports:
      - "8000:8000"
    depends_on:
      neo4j:
        condition: service_healthy

volumes:
  neo4j_data:
