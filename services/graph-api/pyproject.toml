[project]
name = "formula-graph-api"
version = "0.1.0"
description = "Safe HTML/MathML ingestion and Graphiti adapter for FormulaGraph Lab"
requires-python = ">=3.12,<4"
dependencies = [
  "fastapi>=0.116,<1",
  "graphiti-core==0.30.1",
  "httpx>=0.28,<1",
  "lxml>=6,<7",
  "pydantic>=2.11,<3",
  "sympy>=1.14,<2",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1,<2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
