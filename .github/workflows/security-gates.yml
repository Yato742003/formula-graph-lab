name: Security and regression gates
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.13
      - run: npm ci
      - run: npm audit --json > npm-audit.json
      - run: npm test && npm run lint && npx tsc --noEmit --incremental false && npm run build
      - run: uv sync --project services/graph-api --frozen --extra dev
      - run: uv run --project services/graph-api --frozen --extra dev ruff check services/graph-api/app services/graph-api/tests
      - run: uv run --project services/graph-api --frozen --extra dev pytest -c services/graph-api/pyproject.toml services/graph-api/tests
      - run: uv export --project services/graph-api --frozen --no-dev --no-emit-project -o /tmp/fgl-runtime.txt > /dev/null
      - run: uv tool run pip-audit==2.10.1 -r /tmp/fgl-runtime.txt --require-hashes --format json -o python-audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dependency-audit-${{ github.sha }}
          path: |
            npm-audit.json
            python-audit.json
          retention-days: 30
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: graph-api
            dockerfile: Dockerfile
          - name: math-worker
            dockerfile: Dockerfile.sandbox
          - name: performer-worker
            dockerfile: Dockerfile.performer.sandbox
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -f services/graph-api/${{ matrix.dockerfile }} -t fgl-scan:${{ matrix.name }} services/graph-api
      - run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          -v "$PWD:/reports"
          aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
          image --scanners vuln --severity HIGH,CRITICAL --exit-code 1
          --format json --output /reports/image-audit.json fgl-scan:${{ matrix.name }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: image-audit-${{ matrix.name }}-${{ github.sha }}
          path: image-audit.json
          retention-days: 30
