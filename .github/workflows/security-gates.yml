name: Container CVE Gate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: graph-api
            dockerfile: Dockerfile
          - name: math-worker
            dockerfile: Dockerfile.sandbox
          - name: performer-worker
            dockerfile: Dockerfile.performer.sandbox
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -f services/graph-api/${{ matrix.dockerfile }} -t fgl-scan:${{ matrix.name }} services/graph-api
      - run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          -v "$PWD:/reports"
          aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
          image --scanners vuln --severity HIGH,CRITICAL --exit-code 1
          --format json --output /reports/image-audit.json fgl-scan:${{ matrix.name }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: image-audit-${{ matrix.name }}-${{ github.sha }}
          path: image-audit.json
          retention-days: 30
